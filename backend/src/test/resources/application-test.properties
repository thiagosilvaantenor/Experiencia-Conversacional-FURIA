#Arquivo de propriedades para testes
# Configuração do Banco de Dados em Memória H2
spring.datasource.url=jdbc:h2:mem:chatfuriacs;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuração do Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Garante que o banco seja limpo (DROP ALL) e as migrações
# sejam executadas novamente a cada vez que os testes rodam.
spring.flyway.clean-before-migrate=true

# Propriedades da aplicação (se necessárias para os testes)
server.port=8080